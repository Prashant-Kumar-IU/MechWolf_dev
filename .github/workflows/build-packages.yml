name: Build Cross-Platform Executables

# This workflow runs when you create and push a new tag that starts with 'v' (e.g., v1.0, v1.1.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Use a matrix strategy to run the job on Windows, macOS, and Linux
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Check out your repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up the specified Python version
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install your project's dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # 4. Run PyInstaller to create the executable
      #    - The name of the output file will be 'MechWolf'.
      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name "MechWolf" run_mechwolf.py

      # 5. Upload the built executable as an artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # The artifact will be named like 'MechWolf-windows-latest.zip'
          name: MechWolf-${{ matrix.os }}
          path: dist/
